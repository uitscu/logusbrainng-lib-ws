<ng-container *ngIf="isLeft;else isRight">
  <div class="button-container">
    <p-button *ngIf="onDone.observers.length > 0 && !isEdit && isPrivilege" icon="pi pi-save" label="Enregistrer" (onClick)="onDoneDialog()" [disabled]="disabled" [raised]="true" severity="success"></p-button>

    <p-button *ngIf="onDone.observers.length > 0 && isEdit && isPrivilege" icon="pi pi-pencil" label="Modifier" (onClick)="onDoneDialog()" [disabled]="disabled" [raised]="true" severity="success"></p-button>

    <p-button *ngIf="onDismiss.observers.length > 0" icon="pi pi-times" label="Annuler" (onClick)="onDismissDialog()" [raised]="true" severity="danger"></p-button>
  </div>
</ng-container>

<ng-template #isRight>
  <div class="button-container">
    <p-button *ngIf="onDismiss.observers.length > 0" icon="pi pi-times" label="Annuler" (onClick)="onDismissDialog()" [raised]="true" severity="danger" styleClass="mr-2"></p-button>

    <p-button *ngIf="onDone.observers.length > 0 && !isEdit && isPrivilege" icon="pi pi-save" label="Enregistrer" (onClick)="onDoneDialog()" [disabled]="disabled" [raised]="true" severity="success" styleClass="mr-2"></p-button>

    <p-button *ngIf="onDone.observers.length > 0 && isEdit && isPrivilege" icon="pi pi-pencil" label="Modifier" (onClick)="onDoneDialog()" [disabled]="disabled" [raised]="true" severity="success" styleClass="mr-2"></p-button>
  </div>
</ng-template>
