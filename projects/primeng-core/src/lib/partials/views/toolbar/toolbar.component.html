<p-toolbar [class]="styleClass">
  <ng-template #start>
    <div>
      <p-button *ngIf="onCancel.observers.length > 0" icon="pi pi-times" [label]="labelCancel" (onClick)="cancel()" [raised]="true" severity="danger" styleClass="mr-2"></p-button>

      <p-splitbutton *ngIf="onMenuOption.observers.length > 0" [label]="labelSaveOption" icon="pi pi-save"
        (onClick)="saveOption()" [model]="items"></p-splitbutton>

      <p-button *ngIf="onAdd.observers.length > 0  && !isEdit" [label]="labelAdd" icon="pi pi-plus-circle" [raised]="true" severity="primary" styleClass="mr-2" (onClick)="add()" [disabled]="disabled"></p-button>

      <p-button *ngIf="routerLink && !isEdit" [label]="labelAdd" icon="pi pi-plus-circle" [raised]="true" severity="primary" styleClass="mr-2" [routerLink]="routerLink" [disabled]="disabled"></p-button>

      <p-button *ngIf="onEdit.observers.length > 0 && isEdit" [label]="labelEdit" icon="pi pi-save" [raised]="true" [severity]="onSave.observers.length > 0 ? 'primary' : 'success'" styleClass="mr-2" (onClick)="edit()" [disabled]="disabled"></p-button>

      <p-button *ngIf="onImportExcel.observers.length > 0" label="Importer" icon="pi pi-file-excel" [raised]="true" severity="success" styleClass="mr-2" (onClick)="importExcel()" [disabled]="disabled"></p-button>

      <p-button *ngIf="onExportExcel.observers.length > 0" label="Exporter" icon="pi pi-file-excel" [raised]="true" severity="success" styleClass="mr-2" (onClick)="exportExcel()" [disabled]="disabled"></p-button>

      <p-button *ngIf="onSave.observers.length > 0" [label]="labelSave" icon="pi pi-save" [raised]="true" severity="success" styleClass="mr-2" (onClick)="save()" [disabled]="disabled"></p-button>

      <p-button *ngIf="onPrint.observers.length > 0" label="Imprimer" icon="pi pi-print" [raised]="true" severity="warn" styleClass="mr-2" (onClick)="print()"></p-button>

      <p-button *ngIf="onRefresh.observers.length > 0" label="Actualiser" icon="pi pi-refresh" [raised]="true" severity="help" styleClass="mr-2" (onClick)="refresh()"></p-button>
    </div>
  </ng-template>

</p-toolbar>
